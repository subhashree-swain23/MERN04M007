<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real Estate Hero Section</title>
  <link rel="stylesheet" href="task3.css" />
</head>
<body>
  <header class="navbar">
    <div class="logo">PINQL</div>
    <nav>
      <a href="#">Discover</a>
      <a href="#">Help</a>
    </nav>
    <button class="signup-btn">Sign up</button>
  </header>

  <section class="hero">
    <div class="hero-content">
      <div class="switch-buttons">
        <button class="active">Tenant</button>
        <button>Landlord</button>
      </div>

      <h1>Find perfect home <br> for yourself.</h1>

      <div class="search-bar">
        <input type="text" placeholder="Country / Region / City / Postal code" />
        <select>
          <option>Property</option>
          <option>House</option>
          <option>Apartment</option>
          <option>Villa</option>
        </select>
        <select>
          <option>Space</option>
          <option>Small</option>
          <option>Medium</option>
          <option>Large</option>
        </select>
        <select>
          <option>Rooms</option>
          <option>1</option>
          <option>2</option>
          <option>3+</option>
        </select>
        <select>
          <option>Price</option>
          <option>$500–$1000</option>
          <option>$1000–$2000</option>
        </select>
        <select>
          <option>Interior</option>
          <option>Modern</option>
          <option>Classic</option>
        </select>
        <button class="search-btn">Search</button>
      </div>
    </div>

    <div class="hero-image">
      <img src="https://cdn.pixabay.com/photo/2017/07/09/03/19/home-2486092_1280.jpg" alt="Beautiful Home" />
    </div>
  </section>
</body>
</html>

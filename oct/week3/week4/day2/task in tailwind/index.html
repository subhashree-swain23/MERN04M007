<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lawyer Website</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans bg-white text-gray-900">

  
  <header class="flex justify-between items-center px-10 py-6">
    <div class="text-3xl">⚖</div>
    <nav class="hidden md:flex space-x-10 text-gray-800 font-medium">
      <a href="#" class="hover:text-red-500">Services</a>
      <a href="#" class="text-red-500 border-b-2 border-red-500 pb-1">Offices</a>
      <a href="#" class="hover:text-red-500">Team</a>
      <a href="#" class="hover:text-red-500">Philosophy</a>
      <a href="#" class="hover:text-red-500">Spaces</a>
    </nav>
    <button class="border-2 border-red-500 text-red-500 px-6 py-2 rounded-full font-semibold hover:bg-red-500 hover:text-white transition">Login</button>
  </header>


  <section class="flex flex-col md:flex-row items-center justify-between px-10 md:px-20 py-16">
    
    
    <div class="md:w-1/2 relative">
      <h4 class="text-gray-500 text-sm mb-2 tracking-wider">OUR TEAM</h4>
      <h2 class="text-2xl font-bold mb-1">Lorraine Wolf</h2>
      <p class="text-lg mb-4">Technology lawyer</p>
      <a href="#" class="text-red-500 font-semibold border-b border-red-400 hover:text-red-600">Explore</a>

     
      <div class="relative mt-10 w-72 h-72 bg-red-500 rounded-full overflow-hidden flex items-center justify-center">
        <img src="https://images.pexels.com/photos/6077476/pexels-photo-6077476.jpeg" alt="Lawyer" class="w-64 h-64 object-cover rounded-full grayscale">
      </div>
    </div>

   
    <div class="md:w-1/2 bg-red-500 text-white p-10 md:p-16 rounded-l-[40px] mt-10 md:mt-0">
      <h1 class="text-3xl md:text-4xl font-semibold leading-snug mb-6">
        Your legal advisers for the problems of this century
      </h1>
      <p class="text-lg mb-8 opacity-90">We offer solutions adapted to today’s needs</p>
      <button class="bg-white text-red-500 px-8 py-3 rounded-full font-semibold hover:bg-red-100 transition">
        View More
      </button>
    </div>

  </section>

</body>
</html>
